name: Release

# Version-based release: triggered by git tag push (v*) or manual dispatch.
# Publishes GitHub Release, builds & pushes multi-arch container to GHCR
# (ghcr.io/besoeasy/originless:latest, :vX.Y.Z, and :X.Y.Z).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version tag (e.g. v1.0.5, default: auto-bump patch)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Syntax and test check
        run: |
          go vet ./...
          go test ./...
          go build -v .

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -e
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            # Extract version from Go project source (modules/handler.go)
            CODE_VER=$(grep -E '^\s*var Version\s*=\s*' modules/handler.go 2>/dev/null | sed -E 's/.*"([^"]+)".*/\1/' || true)
            if [ -n "$CODE_VER" ] && [ "$CODE_VER" != "dev" ]; then
              TAG="v${CODE_VER#v}"
            else
              LATEST=$(git tag -l "v*" | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | sort -V | tail -n 1)
              if [ -z "$LATEST" ]; then
                TAG="v1.0.0"
              else
                BASE="${LATEST#v}"
                MAJOR=$(echo "$BASE" | cut -d. -f1)
                MINOR=$(echo "$BASE" | cut -d. -f2)
                PATCH=$(echo "$BASE" | cut -d. -f3)
                NEXT_PATCH=$((PATCH + 1))
                TAG="v${MAJOR}.${MINOR}.${NEXT_PATCH}"
              fi
            fi
          fi

          if [[ "$TAG" != v* ]]; then
            TAG="v$TAG"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG (version: $VERSION)"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.5.0
        with:
          cosign-release: "v2.2.4"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=raw,value=${{ steps.tag.outputs.version }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5.0.0
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Sign the published Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -e
          git fetch origin --tags
          SHA="${{ github.sha }}"
          if [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
            SHA="$(git rev-parse HEAD)"
          fi
          PREV=$(git tag -l "v*" | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | grep -v "^${TAG}$" | sort -V | tail -n 1)
          if [ -n "$PREV" ]; then
            NOTES=$(git log --format='- %h %s' "${PREV}..HEAD")
          else
            NOTES=$(git log --format='- %h %s' -10 HEAD)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes || \
            gh release create "$TAG" --target "$SHA" --title "$TAG" --notes "$NOTES"
          fi
