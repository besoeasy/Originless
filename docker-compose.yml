# Originless — records + content-addressed blob storage backend
#
#   docker compose up -d --build
#   open http://localhost:3232
#
# 3232 = API + dashboard

services:
  originless:
    build: .
    image: ${IMAGE:-originless:local}
    container_name: originless
    restart: unless-stopped
    ports:
      - "3232:3232"
    environment:
      STORAGE_MAX: ${STORAGE_MAX:-100GB}
    volumes:
      - originless-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3232/status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  originless-data: