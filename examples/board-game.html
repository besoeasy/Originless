<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Originless — Real-Time 2-Player Board Game</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.09);
      --x-color: #38bdf8;
      --o-color: #f43f5e;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --cell-bg: rgba(255, 255, 255, 0.03);
      --cell-hover: rgba(255, 255, 255, 0.08);
      --cell-border: rgba(255, 255, 255, 0.12);
      --win-glow: rgba(56, 189, 248, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at 50% 10%, #1e1b4b, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    /* Header card */
    .card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6b7280;
    }

    .status-dot.connected {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    .game-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .input-field {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--x-color);
    }

    .btn {
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: #2563eb;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    /* Turn info */
    .turn-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      border: 1px solid var(--card-border);
      font-size: 0.9rem;
    }

    .player-tag {
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .player-x { color: var(--x-color); }
    .player-o { color: var(--o-color); }

    /* Board */
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      aspect-ratio: 1 / 1;
      padding: 12px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
    }

    .cell {
      background: var(--cell-bg);
      border: 1px solid var(--cell-border);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s, transform 0.1s, border-color 0.2s;
    }

    .cell:hover:not(.filled) {
      background: var(--cell-hover);
      transform: scale(0.98);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .cell.x {
      color: var(--x-color);
      text-shadow: 0 0 16px var(--x-color);
    }

    .cell.o {
      color: var(--o-color);
      text-shadow: 0 0 16px var(--o-color);
    }

    .cell.winning {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--x-color);
      animation: pulse 1s infinite alternate;
    }

    .cell.disabled {
      cursor: not-allowed;
    }

    /* Footer info */
    .meta-card {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .mono {
      font-family: monospace;
      color: #93c5fd;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.03); }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header Card -->
    <div class="card">
      <div class="header-bar">
        <h1>Tic-Tac-Toe</h1>
        <div class="status-badge">
          <span id="statusDot" class="status-dot"></span>
          <span id="statusText">Connecting...</span>
        </div>
      </div>

      <div class="game-controls">
        <label style="font-size:0.85rem;color:var(--text-muted)">Game ID:</label>
        <input type="text" id="gameInput" class="input-field" style="width: 130px;" value="game-1">
        <button id="joinBtn" class="btn btn-secondary">Join</button>
        <button id="newGameBtn" class="btn btn-secondary">New Game</button>
        <button id="shareBtn" class="btn btn-secondary">Share</button>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="turn-bar">
      <div>
        <span>You are: </span>
        <strong id="myRoleDisplay" class="player-tag player-x">Assigning...</strong>
      </div>
      <div>
        <span id="turnDisplay">Waiting for opponent...</span>
      </div>
      <div>
        <button id="resetGameBtn" class="btn btn-secondary" style="padding:4px 8px;font-size:0.75rem;">Reset Board</button>
      </div>
    </div>

    <!-- 3x3 Board -->
    <div id="board" class="board">
      <div class="cell" data-idx="0"></div>
      <div class="cell" data-idx="1"></div>
      <div class="cell" data-idx="2"></div>
      <div class="cell" data-idx="3"></div>
      <div class="cell" data-idx="4"></div>
      <div class="cell" data-idx="5"></div>
      <div class="cell" data-idx="6"></div>
      <div class="cell" data-idx="7"></div>
      <div class="cell" data-idx="8"></div>
    </div>

    <!-- Identity & Node Info -->
    <div class="card meta-card">
      <div style="display:flex;justify-content:space-between;">
        <span>Your Ed25519 Pubkey:</span>
        <span id="ownerDisplay" class="mono">Generating...</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span>Originless Node:</span>
        <input type="text" id="nodeInput" class="input-field" style="font-size:0.75rem;padding:4px 8px;width:200px;" value="https://originless.space">
      </div>
      <div style="margin-top:4px;">
        <span>Moves synced via signed Ed25519 events over live SSE streams.</span>
      </div>
    </div>
  </div>

  <script type="module">
    import { ed25519 } from "https://esm.sh/@noble/curves@1.4.0/ed25519";

    // --- State ---
    let nodeUrl = (localStorage.getItem("originless_node") || "https://originless.space").replace(/\/$/, "");
    let gameId = new URLSearchParams(window.location.search).get("game") || "alpha-" + Math.floor(100 + Math.random() * 900);
    let eventSource = null;

    let boardState = Array(9).fill(null);
    let myRole = "X"; // "X" or "O"
    let currentTurn = "X";
    let isGameOver = false;
    let seenEventIds = new Set();
    let moveCount = 0;

    const WINNING_COMBOS = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
      [0, 3, 6], [1, 4, 7], [2, 5, 8], // cols
      [0, 4, 8], [2, 4, 6]             // diags
    ];

    // --- DOM Elements ---
    const boardEl = document.getElementById("board");
    const cells = document.querySelectorAll(".cell");
    const gameInput = document.getElementById("gameInput");
    const nodeInput = document.getElementById("nodeInput");
    const joinBtn = document.getElementById("joinBtn");
    const newGameBtn = document.getElementById("newGameBtn");
    const shareBtn = document.getElementById("shareBtn");
    const resetGameBtn = document.getElementById("resetGameBtn");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const myRoleDisplay = document.getElementById("myRoleDisplay");
    const turnDisplay = document.getElementById("turnDisplay");
    const ownerDisplay = document.getElementById("ownerDisplay");

    gameInput.value = gameId;
    nodeInput.value = nodeUrl;

    // --- Identity ---
    function getOrCreateIdentity() {
      let privHex = localStorage.getItem("originless_privkey");
      let privBytes;
      if (!privHex) {
        privBytes = ed25519.utils.randomPrivateKey();
        privHex = Array.from(privBytes, b => b.toString(16).padStart(2, "0")).join("");
        localStorage.setItem("originless_privkey", privHex);
      } else {
        privBytes = new Uint8Array(privHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
      }
      const pubBytes = ed25519.getPublicKey(privBytes);
      const pubHex = Array.from(pubBytes, b => b.toString(16).padStart(2, "0")).join("");
      return {
        privateKey: privBytes,
        owner: `ed25519:${pubHex}`,
        shortOwner: `ed25519:${pubHex.slice(0, 6)}...${pubHex.slice(-4)}`
      };
    }

    const identity = getOrCreateIdentity();
    ownerDisplay.textContent = identity.shortOwner;
    ownerDisplay.title = identity.owner;

    // --- Canonical JSON & Signing ---
    function canonicalJSON(obj) {
      if (obj === null || typeof obj !== "object") return JSON.stringify(obj);
      if (Array.isArray(obj)) return `[${obj.map(canonicalJSON).join(",")}]`;
      const keys = Object.keys(obj).sort();
      return `{${keys.map((k) => `${JSON.stringify(k)}:${canonicalJSON(obj[k])}`).join(",")}}`;
    }

    async function signEvent({ collection, data, labels = [], ttlSeconds = 86400 * 7 }) {
      const now = Math.floor(Date.now() / 1000);
      const expiresAt = now + ttlSeconds;
      const canonicalData = canonicalJSON(data);
      const sortedLabels = [...labels].sort();
      const blob = "";

      const idString = `${identity.owner}:${collection}:${now}:${expiresAt}:${canonicalData}:${blob}:${sortedLabels.join(",")}`;
      const encoder = new TextEncoder();
      const idDigestBuf = await crypto.subtle.digest("SHA-256", encoder.encode(idString));
      const idDigest = new Uint8Array(idDigestBuf);

      const sigBytes = ed25519.sign(idDigest, identity.privateKey);
      const sigHex = Array.from(sigBytes, b => b.toString(16).padStart(2, "0")).join("");

      return {
        owner: identity.owner,
        collection,
        created_at: now,
        expires_at: expiresAt,
        data,
        labels: sortedLabels,
        sig: sigHex
      };
    }

    // --- Board Logic ---
    function checkWinner() {
      for (const [a, b, c] of WINNING_COMBOS) {
        if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
          return { winner: boardState[a], combo: [a, b, c] };
        }
      }
      if (boardState.every(c => c !== null)) {
        return { winner: "draw", combo: [] };
      }
      return null;
    }

    function updateUI() {
      // Render cells
      cells.forEach((cell, idx) => {
        const val = boardState[idx];
        cell.textContent = val || "";
        cell.className = "cell";
        if (val === "X") cell.classList.add("x", "filled");
        if (val === "O") cell.classList.add("o", "filled");
        if (isGameOver || val || currentTurn !== myRole) {
          cell.classList.add("disabled");
        }
      });

      // Check win
      const result = checkWinner();
      if (result) {
        isGameOver = true;
        if (result.winner === "draw") {
          turnDisplay.textContent = "🤝 Game Draw!";
        } else {
          turnDisplay.textContent = `🎉 Player ${result.winner} Wins!`;
          result.combo.forEach(i => cells[i].classList.add("winning"));
        }
      } else {
        isGameOver = false;
        if (currentTurn === myRole) {
          turnDisplay.textContent = `⚡ Your turn (${myRole})`;
        } else {
          turnDisplay.textContent = `⏳ Opponent's turn (${currentTurn})`;
        }
      }

      myRoleDisplay.textContent = myRole;
      myRoleDisplay.className = `player-tag ${myRole === "X" ? "player-x" : "player-o"}`;
    }

    function applyMove(moveData) {
      const { idx, symbol, turn, action } = moveData;
      if (action === "reset") {
        boardState = Array(9).fill(null);
        currentTurn = "X";
        isGameOver = false;
        cells.forEach(c => c.classList.remove("winning"));
        updateUI();
        return;
      }

      if (idx !== undefined && boardState[idx] === null && !isGameOver) {
        boardState[idx] = symbol;
        currentTurn = symbol === "X" ? "O" : "X";
        moveCount++;
        updateUI();
      }
    }

    async function handleCellClick(e) {
      const idx = parseInt(e.target.dataset.idx, 10);
      if (isNaN(idx) || boardState[idx] || isGameOver || currentTurn !== myRole) return;

      const symbol = myRole;
      applyMove({ idx, symbol, turn: symbol === "X" ? "O" : "X" });

      try {
        const event = await signEvent({
          collection: "boardgame",
          data: { gameId, action: "move", idx, symbol, moveNum: moveCount },
          labels: [`game:${gameId}`]
        });

        const res = await fetch(`${nodeUrl}/events`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(event)
        });

        if (!res.ok) {
          console.error("Failed to publish move:", await res.json());
        }
      } catch (err) {
        console.error("Move error:", err);
      }
    }

    async function resetGame() {
      applyMove({ action: "reset" });
      try {
        const event = await signEvent({
          collection: "boardgame",
          data: { gameId, action: "reset", timestamp: Date.now() },
          labels: [`game:${gameId}`]
        });
        await fetch(`${nodeUrl}/events`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(event)
        });
      } catch (err) {
        console.error("Reset error:", err);
      }
    }

    // --- Load Game & SSE Connection ---
    async function loadGame(id) {
      gameId = id.trim().toLowerCase().replace(/[^a-z0-9_-]/g, "");
      if (!gameId) gameId = "game-1";
      gameInput.value = gameId;

      const url = new URL(window.location);
      url.searchParams.set("game", gameId);
      window.history.replaceState({}, "", url);

      // Reset local board
      boardState = Array(9).fill(null);
      seenEventIds.clear();
      isGameOver = false;
      currentTurn = "X";
      moveCount = 0;

      statusDot.className = "status-dot";
      statusText.textContent = "Syncing game...";

      // 1. Fetch move history from Originless
      try {
        const queryUrl = `${nodeUrl}/events?collection=boardgame&label=game:${encodeURIComponent(gameId)}&limit=100`;
        const res = await fetch(queryUrl);
        if (res.ok) {
          const json = await res.json();
          const events = (json.events || json.records || []).slice().reverse();
          
          // Determine player role: if first event exists and owner is not mine, play as "O"
          if (events.length > 0) {
            const firstMover = events[0].owner;
            myRole = (firstMover === identity.owner) ? "X" : "O";
          } else {
            myRole = "X"; // first player in new room is X
          }

          events.forEach(ev => {
            if (!seenEventIds.has(ev.id)) {
              seenEventIds.add(ev.id);
              if (ev.data) applyMove(ev.data);
            }
          });
        }
      } catch (err) {
        console.warn("Could not fetch game history:", err);
      }

      updateUI();

      // 2. Connect Live Stream (SSE)
      if (eventSource) eventSource.close();
      const streamUrl = `${nodeUrl}/events/stream?collection=boardgame&label=game:${encodeURIComponent(gameId)}`;
      eventSource = new EventSource(streamUrl);

      eventSource.onopen = () => {
        statusDot.className = "status-dot connected";
        statusText.textContent = `Live: #${gameId}`;
      };

      eventSource.addEventListener("event", (e) => {
        try {
          const record = JSON.parse(e.data);
          if (record && !seenEventIds.has(record.id)) {
            seenEventIds.add(record.id);
            if (record.data) applyMove(record.data);
          }
        } catch (err) {
          console.error("Stream parse error:", err);
        }
      });

      eventSource.onerror = () => {
        statusDot.className = "status-dot";
        statusText.textContent = "Reconnecting...";
      };
    }

    // --- Event Listeners ---
    cells.forEach(cell => cell.addEventListener("click", handleCellClick));

    joinBtn.addEventListener("click", () => loadGame(gameInput.value));
    gameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") loadGame(gameInput.value);
    });

    newGameBtn.addEventListener("click", () => {
      const newId = "game-" + Math.floor(1000 + Math.random() * 9000);
      loadGame(newId);
    });

    shareBtn.addEventListener("click", async () => {
      await navigator.clipboard.writeText(window.location.href);
      shareBtn.textContent = "Copied!";
      setTimeout(() => { shareBtn.textContent = "Share"; }, 1500);
    });

    resetGameBtn.addEventListener("click", resetGame);

    nodeInput.addEventListener("change", () => {
      nodeUrl = nodeInput.value.trim().replace(/\/$/, "");
      localStorage.setItem("originless_node", nodeUrl);
      loadGame(gameId);
    });

    // Start
    loadGame(gameId);
  </script>
</body>
</html>
