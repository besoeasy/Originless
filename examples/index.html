<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tools — Originless</title>
  <meta name="description" content="Standalone client tools for Originless IPFS nodes." />
  <meta name="theme-color" content="#0b0b0c" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
<div id="app" class="app-shell">

  <header class="app-topbar">
    <div class="topbar-start">
      <a class="brand" href="/">
        <img src="/logo.svg" alt="" />
        Originless
      </a>
      <nav class="app-nav">
        <a href="/">Library</a>
        <a href="/agent">Agent</a>
        <a href="/examples/" class="is-current">Tools</a>
      </nav>
    </div>
    <div class="topbar-end">
      <label class="select-plain">
        <span>Gateway</span>
        <select v-model="currentGateway" @change="onGatewayChange">
          <option v-for="gw in gateways" :key="gw.url" :value="gw.url">{{ gw.label }}</option>
        </select>
      </label>
      <a class="icon-btn github-btn" href="https://github.com/besoeasy/Originless" target="_blank" rel="noopener" title="GitHub">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
      </a>
    </div>
  </header>

  <div class="app-body">
    <section class="workspace">
      <div class="workspace-bar">
        <div class="bar-title">
          <h1>Tools</h1>
          <span class="count">{{ tools.length }}</span>
        </div>
        <div class="bar-tools">
          <span class="mono" style="font-size:12px;color:var(--ink-3)">Uploads land in Library after pin</span>
        </div>
      </div>

      <div class="workspace-scroll">
        <div v-for="cat in categorizedTools" :key="cat.name" class="section-block">
          <div class="section-label">{{ cat.name }}</div>
          <div class="tool-grid">
            <a v-for="tool in cat.tools" :key="tool.file" class="tool-card" :href="tool.file">
              <div class="tool-card-head">
                <span class="endpoint" :class="{ 'is-post': isPostTool(tool) }">{{ tool.endpoint || 'TOOL' }}</span>
                <span class="tool-card-open">Open</span>
              </div>
              <h2>{{ tool.title }}</h2>
              <p>{{ tool.description }}</p>
            </a>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
  const { createApp } = Vue;

  const defaultTools = [
    {
      file: "upload-file.html",
      title: "Single File Uploader",
      description: "Pin images, video, audio, and documents as exact bytes. SHA-256 multihash plus HTML/Markdown embed codes.",
      category: "Storage & Publishing",
      endpoint: "POST /upload",
      badge: "pill-post",
      order: 1
    },
    {
      file: "upload-media.html",
      title: "Anonymized Image Uploader",
      description: "Strip EXIF, GPS, and XMP from JPEG/PNG/GIF/WebP, then pin the cleaned bytes.",
      category: "Storage & Publishing",
      endpoint: "POST /media",
      badge: "pill-post",
      order: 2
    },
    {
      file: "upload-folder.html",
      title: "Folder & DApp Uploader",
      description: "Pin a static site or dist/ folder with relative paths under one root CID.",
      category: "Storage & Publishing",
      endpoint: "POST /uploadfolder",
      badge: "pill-post",
      order: 3
    },
    {
      file: "snippet.html",
      title: "Snippets & Pastebin",
      description: "Pin code, logs, and text with syntax highlighting and a public gateway link.",
      category: "Storage & Publishing",
      endpoint: "POST /upload",
      badge: "pill-post",
      order: 4
    },
    {
      file: "picture.html",
      title: "Kind 20 Picture Post",
      description: "Multi-image dumps with NIP-92 imeta. Upload, preview, copy JSON, or publish.",
      category: "Nostr",
      endpoint: "NIP-68 · Kind 20",
      badge: "pill-post",
      order: 5
    },
    {
      file: "post.html",
      title: "Kind 1 Note",
      description: "Short notes with IPFS images and NIP-92 imeta. Preview, copy JSON, or publish.",
      category: "Nostr",
      endpoint: "NIP-01 · Kind 1",
      badge: "pill-get",
      order: 6
    },
    {
      file: "article.html",
      title: "Kind 30023 Article",
      description: "Long-form Markdown, pin images, preview, publish Kind 30023 or save a draft.",
      category: "Nostr",
      endpoint: "NIP-23 · Kind 30023",
      badge: "pill-post",
      order: 7
    }
  ];

  createApp({
    data() {
      const initialNode = localStorage.getItem("originless_node_url") ||
        ((window.location.origin && window.location.origin !== "null" && window.location.protocol.startsWith("http"))
          ? window.location.origin
          : "http://localhost:3232");

      const localGw = (window.location.origin && window.location.origin !== "null" && window.location.protocol.startsWith("http"))
        ? `${window.location.origin}/ipfs/`
        : "http://localhost:3232/ipfs/";
      const savedGateway = localStorage.getItem("ol_gateway_url");
      const gateways = [
        { label: "This node (Originless)", url: localGw },
        { label: "inbrowser.link", url: "https://inbrowser.link/ipfs/" },
        { label: "ipfs.io (Official)", url: "https://ipfs.io/ipfs/" },
      ];

      return {
        nodeUrl: initialNode,
        nodeOnline: false,
        peerCount: 0,
        tools: defaultTools,
        loadingTools: false,
        gateways,
        currentGateway: savedGateway || localGw,
      };
    },
    computed: {
      categorizedTools() {
        const groups = {};
        for (const tool of this.tools) {
          const cat = tool.category || "General";
          if (!groups[cat]) groups[cat] = [];
          groups[cat].push(tool);
        }
        return Object.keys(groups).map((name) => ({ name, tools: groups[name] }));
      }
    },
    methods: {
      onGatewayChange() {
        localStorage.setItem("ol_gateway_url", this.currentGateway);
      },
      isPostTool(tool) {
        const endpoint = (tool.endpoint || "").toUpperCase();
        return endpoint.startsWith("POST") || tool.badge === "pill-post";
      },
      promptChangeNode() {
        const url = prompt("Enter Originless Node URL:", this.nodeUrl);
        if (url && url.trim()) {
          this.nodeUrl = url.trim().replace(/\/+$/, "");
          localStorage.setItem("originless_node_url", this.nodeUrl);
          this.checkNodeStatus();
          this.fetchTools();
        }
      },
      async checkNodeStatus() {
        try {
          const res = await fetch(this.nodeUrl + "/status");
          const data = await res.json();
          if (data.status === "success") {
            this.nodeOnline = true;
            this.peerCount = data.peers?.count || 0;
            return;
          }
        } catch (_) {}
        this.nodeOnline = false;
      },
      async fetchTools() {
        try {
          this.loadingTools = true;
          const endpoint = (this.nodeUrl ? this.nodeUrl.replace(/\/+$/, "") : "") + "/api/examples";
          const res = await fetch(endpoint);
          if (res.ok) {
            const data = await res.json();
            if (data.status === "success" && Array.isArray(data.tools) && data.tools.length > 0) {
              this.tools = data.tools;
            }
          }
        } catch (_) {
        } finally {
          this.loadingTools = false;
        }
      }
    },
    mounted() {
      this.checkNodeStatus();
      this.fetchTools();
    },
  }).mount("#app");
</script>
</body>
</html>
