<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Originless — Real-Time Room Comments</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-glow: rgba(59, 130, 246, 0.25);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --my-msg: #1d4ed8;
      --other-msg: #1f2937;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at top right, #131c31, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      height: 92vh;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    /* Header */
    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(0, 0, 0, 0.2);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title-group h1 {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6b7280;
    }

    .status-dot.connected {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .room-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .input-field {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: var(--accent);
    }

    .room-input {
      font-weight: 600;
      width: 140px;
    }

    .node-input {
      font-size: 0.75rem;
      color: var(--text-muted);
      width: 180px;
    }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid var(--card-border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .identity-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      padding-top: 4px;
      border-top: 1px dashed rgba(255, 255, 255, 0.06);
    }

    .user-key {
      font-family: monospace;
      color: #93c5fd;
    }

    /* Messages Area */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .message-row {
      display: flex;
      flex-direction: column;
      max-width: 80%;
      animation: fadeIn 0.2s ease;
    }

    .message-row.self {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message-row.other {
      align-self: flex-start;
      align-items: flex-start;
    }

    .message-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: flex;
      gap: 8px;
    }

    .message-bubble {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.4;
      word-break: break-word;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .message-row.self .message-bubble {
      background: var(--my-msg);
      border-bottom-right-radius: 2px;
      color: #fff;
    }

    .message-row.other .message-bubble {
      background: var(--other-msg);
      border: 1px solid var(--card-border);
      border-bottom-left-radius: 2px;
      color: var(--text);
    }

    /* Input Footer */
    footer {
      padding: 16px 20px;
      border-top: 1px solid var(--card-border);
      background: rgba(0, 0, 0, 0.2);
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .comment-input {
      flex: 1;
      padding: 10px 14px;
      font-size: 0.92rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-top">
        <div class="title-group">
          <h1>Originless Room Comments</h1>
          <span class="status-badge">
            <span id="statusDot" class="status-dot"></span>
            <span id="statusText">Connecting...</span>
          </span>
        </div>

        <div class="room-bar">
          <label style="font-size:0.8rem;color:var(--text-muted)">Room:</label>
          <input type="text" id="roomInput" class="input-field room-input" value="general">
          <button id="switchRoomBtn" class="btn btn-secondary">Switch</button>
          <button id="copyLinkBtn" class="btn btn-secondary" title="Copy room URL">Share</button>
        </div>
      </div>

      <div class="identity-bar">
        <div>
          <span>Your Ed25519: </span>
          <span id="ownerDisplay" class="user-key">Generating...</span>
        </div>
        <div>
          <span>Node: </span>
          <input type="text" id="nodeInput" class="input-field node-input" value="https://originless.space">
        </div>
      </div>
    </header>

    <div id="messagesContainer" class="messages-container">
      <div id="emptyState" class="empty-state">No comments yet in this room.<br>Send the first signed message!</div>
    </div>

    <footer>
      <form id="commentForm" class="form-row">
        <input type="text" id="authorInput" class="input-field" placeholder="Nickname" value="Anon" style="width: 100px;">
        <input type="text" id="commentInput" class="input-field comment-input" placeholder="Write a comment..." autocomplete="off" required>
        <button type="submit" id="sendBtn" class="btn">Send</button>
      </form>
    </footer>
  </div>

  <script type="module">
    import { ed25519 } from "https://esm.sh/@noble/curves@1.4.0/ed25519";

    // --- State ---
    let nodeUrl = (localStorage.getItem("originless_node") || "https://originless.space").replace(/\/$/, "");
    let currentRoom = new URLSearchParams(window.location.search).get("room") || "general";
    let eventSource = null;
    let seenEventIds = new Set();

    // --- DOM Elements ---
    const roomInput = document.getElementById("roomInput");
    const nodeInput = document.getElementById("nodeInput");
    const switchRoomBtn = document.getElementById("switchRoomBtn");
    const copyLinkBtn = document.getElementById("copyLinkBtn");
    const ownerDisplay = document.getElementById("ownerDisplay");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const messagesContainer = document.getElementById("messagesContainer");
    const emptyState = document.getElementById("emptyState");
    const commentForm = document.getElementById("commentForm");
    const commentInput = document.getElementById("commentInput");
    const authorInput = document.getElementById("authorInput");
    const sendBtn = document.getElementById("sendBtn");

    // Init inputs
    roomInput.value = currentRoom;
    nodeInput.value = nodeUrl;
    authorInput.value = localStorage.getItem("originless_nickname") || "Anon";

    // --- Identity (Ed25519 in localStorage) ---
    function getOrCreateIdentity() {
      let privHex = localStorage.getItem("originless_privkey");
      let privBytes;
      if (!privHex) {
        privBytes = ed25519.utils.randomPrivateKey();
        privHex = Array.from(privBytes, b => b.toString(16).padStart(2, "0")).join("");
        localStorage.setItem("originless_privkey", privHex);
      } else {
        privBytes = new Uint8Array(privHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
      }
      const pubBytes = ed25519.getPublicKey(privBytes);
      const pubHex = Array.from(pubBytes, b => b.toString(16).padStart(2, "0")).join("");
      return {
        privateKey: privBytes,
        owner: `ed25519:${pubHex}`,
        shortOwner: `ed25519:${pubHex.slice(0, 6)}...${pubHex.slice(-4)}`
      };
    }

    const identity = getOrCreateIdentity();
    ownerDisplay.textContent = identity.shortOwner;
    ownerDisplay.title = identity.owner;

    // --- Canonical JSON Helper ---
    function canonicalJSON(obj) {
      if (obj === null || typeof obj !== "object") return JSON.stringify(obj);
      if (Array.isArray(obj)) return `[${obj.map(canonicalJSON).join(",")}]`;
      const keys = Object.keys(obj).sort();
      return `{${keys.map((k) => `${JSON.stringify(k)}:${canonicalJSON(obj[k])}`).join(",")}}`;
    }

    // --- Sign Event ---
    async function signEvent({ collection, data, labels = [], ttlSeconds = 86400 * 30 }) {
      const now = Math.floor(Date.now() / 1000);
      const expiresAt = now + ttlSeconds;
      const canonicalData = canonicalJSON(data);
      const sortedLabels = [...labels].sort();
      const blob = "";

      // owner:collection:created_at:expires_at:canonical_data:blob:labels_csv
      const idString = `${identity.owner}:${collection}:${now}:${expiresAt}:${canonicalData}:${blob}:${sortedLabels.join(",")}`;
      const encoder = new TextEncoder();
      const idDigestBuf = await crypto.subtle.digest("SHA-256", encoder.encode(idString));
      const idDigest = new Uint8Array(idDigestBuf);

      const sigBytes = ed25519.sign(idDigest, identity.privateKey);
      const sigHex = Array.from(sigBytes, b => b.toString(16).padStart(2, "0")).join("");

      return {
        owner: identity.owner,
        collection,
        created_at: now,
        expires_at: expiresAt,
        data,
        labels: sortedLabels,
        sig: sigHex
      };
    }

    // --- Render Message ---
    function appendMessage(event, scroll = true) {
      if (!event || seenEventIds.has(event.id)) return;
      seenEventIds.add(event.id);

      emptyState.style.display = "none";

      const isSelf = event.owner === identity.owner;
      const author = event.data?.author || "Anon";
      const text = event.data?.text || "";
      const timeStr = new Date(event.created_at * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

      const row = document.createElement("div");
      row.className = `message-row ${isSelf ? "self" : "other"}`;

      const meta = document.createElement("div");
      meta.className = "message-meta";
      meta.innerHTML = `<span><strong>${escapeHtml(author)}</strong> (${event.owner.slice(8, 14)})</span><span>${timeStr}</span>`;

      const bubble = document.createElement("div");
      bubble.className = "message-bubble";
      bubble.textContent = text;

      row.appendChild(meta);
      row.appendChild(bubble);
      messagesContainer.appendChild(row);

      if (scroll) {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }
    }

    function escapeHtml(str) {
      return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // --- Load History & Connect Stream ---
    async function loadRoom(room) {
      currentRoom = room.trim().toLowerCase().replace(/[^a-z0-9_-]/g, "");
      if (!currentRoom) currentRoom = "general";
      roomInput.value = currentRoom;

      // Update URL
      const url = new URL(window.location);
      url.searchParams.set("room", currentRoom);
      window.history.replaceState({}, "", url);

      // Reset UI
      messagesContainer.innerHTML = "";
      messagesContainer.appendChild(emptyState);
      emptyState.style.display = "block";
      seenEventIds.clear();

      statusDot.className = "status-dot";
      statusText.textContent = "Loading history...";

      // 1. Fetch recent events (newest-first, then reverse to chronological)
      try {
        const queryUrl = `${nodeUrl}/events?collection=chat&label=room:${encodeURIComponent(currentRoom)}&limit=50`;
        const res = await fetch(queryUrl);
        if (res.ok) {
          const json = await res.json();
          const events = (json.events || json.records || []).slice().reverse();
          events.forEach(ev => appendMessage(ev, false));
          messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
      } catch (err) {
        console.warn("Failed to fetch past events:", err);
      }

      // 2. Connect Server-Sent Events (SSE)
      if (eventSource) {
        eventSource.close();
      }

      const streamUrl = `${nodeUrl}/events/stream?collection=chat&label=room:${encodeURIComponent(currentRoom)}`;
      eventSource = new EventSource(streamUrl);

      eventSource.onopen = () => {
        statusDot.className = "status-dot connected";
        statusText.textContent = `Live: #${currentRoom}`;
      };

      eventSource.addEventListener("event", (e) => {
        try {
          const record = JSON.parse(e.data);
          appendMessage(record, true);
        } catch (err) {
          console.error("Failed to parse event stream payload:", err);
        }
      });

      eventSource.onerror = () => {
        statusDot.className = "status-dot";
        statusText.textContent = "Reconnecting...";
      };
    }

    // --- Form Submit (Publish Comment) ---
    commentForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = commentInput.value.trim();
      const author = authorInput.value.trim() || "Anon";
      if (!text) return;

      localStorage.setItem("originless_nickname", author);
      sendBtn.disabled = true;

      try {
        const event = await signEvent({
          collection: "chat",
          data: { text, author, room: currentRoom },
          labels: [`room:${currentRoom}`]
        });

        const res = await fetch(`${nodeUrl}/events`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(event)
        });

        if (res.ok) {
          commentInput.value = "";
          // If SSE didn't already deliver it, append optimistically
          event.id = (await res.json()).id;
          appendMessage(event, true);
        } else {
          const err = await res.json();
          alert(`Publish failed: ${err.error || res.statusText}`);
        }
      } catch (err) {
        alert(`Error publishing comment: ${err.message}`);
      } finally {
        sendBtn.disabled = false;
        commentInput.focus();
      }
    });

    // --- Event Listeners ---
    switchRoomBtn.addEventListener("click", () => loadRoom(roomInput.value));
    roomInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") loadRoom(roomInput.value);
    });

    nodeInput.addEventListener("change", () => {
      nodeUrl = nodeInput.value.trim().replace(/\/$/, "");
      localStorage.setItem("originless_node", nodeUrl);
      loadRoom(currentRoom);
    });

    copyLinkBtn.addEventListener("click", async () => {
      await navigator.clipboard.writeText(window.location.href);
      copyLinkBtn.textContent = "Copied!";
      setTimeout(() => { copyLinkBtn.textContent = "Share"; }, 1500);
    });

    // Start
    loadRoom(currentRoom);
  </script>
</body>
</html>
